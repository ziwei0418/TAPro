# ============================================================
# LUAD-HistoSeg Training Configuration for WSSS
# Usage: python scripts/train.py --config configs/luad.yaml
# ============================================================

model:
  hf_token: "REMOVED_HF_TOKEN"
  fpn_out_dims: [128, 320, 512]
  label_feature_path: "data/prototypes/luad_label_fea_proto_3333.pkl"
  n_ratio: 0.5
  use_lora: false

dataset:
  name: "luad"
  train_root: "data/LUAD-HistoSeg/training"
  val_root: "data/LUAD-HistoSeg"
  test_root: "data/LUAD-HistoSeg"
  cls_num_classes: 4  # TE, NEC, LYM, TAS
  input_size: [224, 224]

work_dir:
  ckpt_dir: "checkpoints/luad"
  pred_dir: "predictions_luad"
  train_log_dir: "train_log/luad"

train:
  samples_per_gpu: 4
  accum_steps: 4
  epoch: 15

  l2: 0.1
  l3: 1.0
  l4: 1.0
  l5: 0.05

  mask_adapter_alpha: 0.5
  merge_train: "mean"
  merge_test: "max"

  use_tta: true
  use_crf: false
  crf_iter_max: 10
  crf_pos_w: 3
  crf_pos_xy_std: 1
  crf_bi_w: 4
  crf_bi_xy_std: 67
  crf_bi_rgb_std: 3

  use_vq: true
  vq_num_codes: 128
  vq_code_dim: 256
  vq_commitment_weight: 0.15
  vq_cam_weight: 0.3
  vq_loss_weight: 0.1
  sem_reg_weight: 0.03

  use_multires_consistency: true
  multires_weight: 0.05

  use_binary_hash: true
  hash_dim: 128
  hash_top_k: 16
  hash_quant_weight: 0.01
  hash_bank_capacity: 4096

  use_text_proto: true

  use_early_stop: true
  patience: 3

optimizer:
  type: "AdamW"
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.001

scheduler:
  warmup_iter: 0
  warmup_ratio: 0.000001
  power: 1.0
