# ============================================================
# Default Training Configuration for WSSS
# ============================================================

model:
  hf_token: ""  # set via HF_TOKEN env var
  fpn_out_dims: [64, 128, 320, 512]
  label_feature_path: "data/prototypes/bcss_label_fea_pro_3333.pkl"
  n_ratio: 0.5
  use_lora: false  # Set to true for LoRA fine-tuning

dataset:
  name: "bcss"
  train_root: r"E:\dataset\BCSS-WSSS\train"
  val_root: r"E:\dataset\BCSS-WSSS"
  test_root: r"E:\dataset\BCSS-WSSS"
  cls_num_classes: 4  # TUM, STR, LYM, NEC
  input_size: [224, 224]

work_dir:
  ckpt_dir: "train_log/bcss_copy5/checkpoints"
  pred_dir: "train_log/bcss_copy5/predictions"
  train_log_dir: "train_log/bcss_copy5"

train:
  # Training parameters
  samples_per_gpu: 4
  accum_steps: 4
  epoch: 8
  
  # Multi-scale loss weights
  l1: 0.0   # Scale 1 weight (0.0 in copy5 — P1 only contributes to CAM fusion, not cls loss)
  l2: 0.1   # Scale 2 (28x28) weight
  l3: 1.0   # Scale 3 (14x14) weight
  l4: 1.0   # Scale 4 (7x7) weight
  l5: 0.05  # Contrastive loss weight
  
  # CAM generation
  mask_adapter_alpha: 0.5
  merge_train: "mean"  # or "max"
  merge_test: "max"    # or "mean"
  
  # Augmentation and post-processing
  use_tta: false       # Test-time augmentation
  use_crf: false       # CRF post-processing
  crf_iter_max: 10
  crf_pos_w: 3
  crf_pos_xy_std: 1
  crf_bi_w: 4
  crf_bi_xy_std: 67
  crf_bi_rgb_std: 3
  
  # === Text Prototype Path ===
  use_text_proto: true
  use_hybrid_proto_blend: true
  use_bg_prompt_suppression: false
  bg_prompt_mode: "pathology"
  bg_prompt_weight: 0.03
  bg_prompt_align_weight: 1.0
  bg_prompt_repel_weight: 0.5
  bg_prompt_stability_weight: 0.1
  bg_prompt_temp: 0.07
  bg_prompt_margin: 0.10
  bg_prompt_warmup_epochs: 2.0
  
  info_nce_temp: 0.07
  
  # === Early Stopping ===
  use_early_stop: true
  patience: 2   # Number of epochs without improvement before stopping

optimizer:
  type: "AdamW"
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.001

scheduler:
  warmup_iter: 0
  warmup_ratio: 0.000001
  power: 1.0
