# ============================================================
# BCSS Fixed Alpha 0.6 + CAM Power + Attention Boundary TAGD
# ============================================================

model:
  hf_token: "REMOVED_HF_TOKEN"
  fpn_out_dims: [64, 128, 320, 512]
  label_feature_path: "data/prototypes/bcss_label_fea_pro_3333.pkl"
  n_ratio: 0.5
  use_lora: false

dataset:
  name: "bcss"
  train_root: "E:/dataset/BCSS-WSSS/train"
  val_root: "E:/dataset/BCSS-WSSS"
  test_root: "E:/dataset/BCSS-WSSS"
  cls_num_classes: 4
  input_size: [224, 224]

work_dir:
  ckpt_dir: "train_log/bcss_fixed_0p6_feature_region_abdiv_beta2/checkpoints"
  pred_dir: "train_log/bcss_fixed_0p6_feature_region_abdiv_beta2/predictions"
  train_log_dir: "train_log/bcss_fixed_0p6_feature_region_abdiv_beta2"

train:
  samples_per_gpu: 4
  accum_steps: 4
  epoch: 8

  l1: 0.0
  l2: 0.1
  l3: 1.0
  l4: 1.0
  l5: 0.05

  mask_adapter_alpha: 0.5
  merge_train: "mean"
  merge_test: "max"

  use_tta: false
  use_crf: false
  crf_iter_max: 10
  crf_pos_w: 3
  crf_pos_xy_std: 1
  crf_bi_w: 4
  crf_bi_xy_std: 67
  crf_bi_rgb_std: 3

  use_text_proto: true
  use_hybrid_proto_blend: true
  hybrid_alpha_mode: "fixed"
  hybrid_alpha_fixed: 0.6
  use_bg_prompt_suppression: false
  info_nce_temp: 0.07

  use_cam_power_calibration: true
  cam_power_values: [1.20, 1.15, 0.85, 1.00]
  cam_power_blend: 0.35
  cam_power_eps: 0.000001

  use_feature_region_refine: true
  feature_region_blend: 0.35
  feature_region_class_blends: [0.35, 0.35, 0.20, 0.45]
  feature_region_sim_threshold: 0.55
  feature_region_temp: 0.10

  use_attention_boundary_refine: true
  attention_boundary_beta: 2.0
  attention_boundary_block: 23
  attention_boundary_target_size: 7

  use_early_stop: true
  patience: 2

optimizer:
  type: "AdamW"
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.001

scheduler:
  warmup_iter: 0
  warmup_ratio: 0.000001
  power: 1.0
